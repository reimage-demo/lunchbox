<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Quick links for Lunch Box: order food, check an order, explore catering and visit the homepage."
    />
    <meta name="robots" content="noindex,follow,noarchive" />
    <meta name="theme-color" content="#090909" />
    <title>Lunch Box | Quick Links</title>
    <link rel="icon" href="assets/logo-transparent.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --black: #090909;
        --black-soft: #1a1a1a;
        --red: #ed1c24;
        --red-dark: #bd1017;
        --paper: #fff;
        --cream: #f5f3ef;
        --ink: #171717;
        --muted: #6f6a67;
        --line: rgba(23, 23, 23, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        padding: clamp(14px, 4vw, 28px);
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--ink);
        background: var(--black);
        font-family: "Inter", Arial, sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        z-index: 0;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.9)),
          url("assets/images/lunch-box/grill.webp") center 48% / cover;
        filter: saturate(0.9) contrast(1.04);
      }

      .quick-frame {
        position: relative;
        z-index: 1;
        width: min(100%, 420px);
        padding: clamp(20px, 5vw, 30px);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.48);
        border-radius: 22px;
        background: rgba(245, 243, 239, 0.97);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      .quick-frame::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 5px;
        background: var(--red);
      }

      .logo-frame {
        width: 132px;
        min-height: 104px;
        margin: 0 auto 17px;
        padding: 12px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 17px;
        background: linear-gradient(145deg, var(--black-soft), var(--black));
        box-shadow:
          0 16px 34px rgba(0, 0, 0, 0.25),
          inset 0 1px rgba(255, 255, 255, 0.08);
      }

      .logo-frame img {
        width: 112px;
        height: auto;
        display: block;
        border-radius: 8px;
        background: #fff;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
      }

      h1 {
        margin: 0;
        font: 800 clamp(30px, 9vw, 42px) / 1 "Sora", "Inter", sans-serif;
        letter-spacing: -0.045em;
      }

      h1 span {
        color: var(--red);
      }

      .subtitle {
        margin: 8px 0 23px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .quick-links {
        display: grid;
        gap: 10px;
      }

      .quick-link {
        min-height: 54px;
        padding: 12px 15px;
        display: grid;
        grid-template-columns: 36px 1fr;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--ink);
        background: var(--paper);
        box-shadow: 0 9px 22px rgba(0, 0, 0, 0.07);
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      .link-icon {
        width: 32px;
        height: 32px;
        padding: 7px;
        display: block;
        border-radius: 7px;
        color: var(--black);
        background: #f0eeeb;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .link-label {
        padding-right: 32px;
        text-align: center;
      }

      .quick-link.status {
        color: #fff;
        border-color: var(--black);
        background: var(--black);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22);
      }

      .quick-link.status .link-icon {
        color: #fff;
        background: var(--red);
      }

      .quick-link:hover {
        transform: translateY(-2px);
        border-color: rgba(23, 23, 23, 0.28);
        box-shadow: 0 13px 28px rgba(0, 0, 0, 0.13);
      }

      .quick-link.status:hover {
        border-color: #2b2b2b;
        background: #2b2b2b;
      }

      .quick-link:focus-visible,
      .powered-by a:focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 3px;
      }

      .frame-footer {
        margin-top: 22px;
        padding-top: 17px;
        border-top: 1px solid var(--line);
      }

      .location {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .powered-by {
        margin: 0;
        color: #7b7774;
        font-size: 10px;
        letter-spacing: 0.04em;
        line-height: 1.5;
      }

      .powered-by a {
        display: inline;
        color: var(--red-dark);
        font-weight: 800;
        text-decoration: none;
      }

      .powered-by a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @media (max-height: 650px) {
        body {
          align-items: start;
          padding: 9px;
        }

        .quick-frame {
          padding: 15px 17px;
          border-radius: 17px;
        }

        .logo-frame {
          width: 104px;
          min-height: 78px;
          margin-bottom: 10px;
          padding: 8px;
        }

        .logo-frame img {
          width: 88px;
        }

        h1 {
          font-size: 28px;
        }

        .subtitle {
          margin: 5px 0 13px;
          font-size: 11px;
        }

        .quick-link {
          min-height: 48px;
        }

        .frame-footer {
          margin-top: 13px;
          padding-top: 11px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .quick-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="quick-frame">
      <div class="logo-frame">
        <img
          src="assets/logo-transparent.webp"
          width="1000"
          height="732"
          alt="Lunch Box"
        />
      </div>

      <h1>Lunch <span>Box</span></h1>
      <p class="subtitle">Fresh food, easy pickup and catering for the whole crew.</p>

      <nav class="quick-links" aria-label="Lunch Box quick links">
        <a class="quick-link status" href="order-status.html">
          <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z" />
            <path d="M9 8h6M9 12h6M9 16h3" />
          </svg>
          <span class="link-label">Check Order Status</span>
        </a>

        <a class="quick-link home" href="index.html">
          <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 11.5 12 4l9 7.5" />
            <path d="M5.5 10.5V20h13v-9.5M9.5 20v-6h5v6" />
          </svg>
          <span class="link-label">Home</span>
        </a>

        <a class="quick-link menu" href="menu.html">
          <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 7h12l1 13H5L6 7Z" />
            <path d="M9 9V6a3 3 0 0 1 6 0v3" />
          </svg>
          <span class="link-label">View Menu &amp; Order</span>
        </a>

        <a class="quick-link catering" href="catering.html">
          <svg class="link-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 17h16" />
            <path d="M6 17a6 6 0 0 1 12 0" />
            <path d="M12 11V8" />
            <path d="M10 8h4" />
            <path d="M3 20h18" />
          </svg>
          <span class="link-label">Catering</span>
        </a>
      </nav>

      <footer class="frame-footer">
        <p class="location">104 Baltimore St · Hartford, CT 06112</p>
        <p class="powered-by">
          Powered by
          <a
            href="https://www.reimagebs.com"
            target="_blank"
            rel="noopener noreferrer"
            >REIMAGE BUSINESS SOLUTIONS</a
          >
        </p>
      </footer>
    </main>
  </body>
</html>
