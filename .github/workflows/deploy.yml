name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-portal/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix admin-portal ci

      - name: Build public site and admin portal
        env:
          VITE_CONVEX_URL: https://uncommon-bullfrog-641.convex.cloud
          VITE_PUBLIC_SITE_URL: https://lunchboxct.com/
        run: |
          npm run public:build
          npm run admin:build
          cp -R admin-portal/dist/. admin-portal/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
